# Servidor rAthena (Renovacao ate a transclasse, PACKETVER 20250402) para desenvolvimento local.
# Baseado em rathena/tools/docker/docker-compose.yml.
#
# O codigo do rAthena fica fora deste repositorio (no filesystem do WSL, para compilar rapido).
# Padrao: ~/mythofthor-server/rathena — sobrescreva com a variavel RATHENA_DIR.
# Uso (dentro do WSL): veja server/README.md

x-rathena: &rathena
  image: "rathena:local"
  build:
    context: "${RATHENA_DIR:-${HOME}/mythofthor-server/rathena}/tools/docker"
    dockerfile: Dockerfile
  volumes:
    - "${RATHENA_DIR:-${HOME}/mythofthor-server/rathena}:/rathena"
    - "${RATHENA_DIR:-${HOME}/mythofthor-server/rathena}/tools/docker/asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # conexao com o db
    - "${RATHENA_DIR:-${HOME}/mythofthor-server/rathena}/tools/docker/asset/char_conf.txt:/rathena/conf/import/char_conf.txt"   # login <-> char
    - "${RATHENA_DIR:-${HOME}/mythofthor-server/rathena}/tools/docker/asset/map_conf.txt:/rathena/conf/import/map_conf.txt"     # char <-> map
  init: true
  tty: true
  stdin_open: true

services:
  db:
    image: "mariadb:noble"
    container_name: "mythofthor-db"
    restart: unless-stopped
    ports:
      - "3311:3306" # Mapeado para 3311 para evitar colisao na maquina host
    volumes:
      - "rathenadb:/var/lib/mysql"
      - "${RATHENA_DIR:-${HOME}/mythofthor-server/rathena}/sql-files/:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: ragnarok
      MYSQL_DATABASE: ragnarok
      MYSQL_USER: ragnarok
      MYSQL_PASSWORD: ragnarok

  builder:
    <<: *rathena
    container_name: "mythofthor-builder"
    command: "/rathena/tools/docker/builder.sh"
    profiles: ["build"] # so roda com: docker compose --profile build run --rm builder
    environment:
      BUILDER_CONFIGURE: "--enable-packetver=20250402 --enable-prere=no"

  login:
    <<: *rathena
    container_name: "mythofthor-login"
    command: sh -c "/bin/wait-for db:3306 -- /rathena/login-server"
    restart: unless-stopped
    ports:
      - "6900:6900"
    depends_on:
      - db

  char:
    <<: *rathena
    container_name: "mythofthor-char"
    command: sh -c "/bin/wait-for db:3306 -- /rathena/char-server"
    restart: unless-stopped
    ports:
      - "6121:6121"
    depends_on:
      - login

  map:
    <<: *rathena
    container_name: "mythofthor-map"
    command: sh -c "/bin/wait-for db:3306 -- /rathena/map-server"
    restart: unless-stopped
    ports:
      - "5121:5121"
    depends_on:
      - char

volumes:
  rathenadb:
